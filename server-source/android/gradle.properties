# JVM args: -Dfile.encoding matters on a Chinese Windows host, where the default is GBK and
# Kotlin would otherwise read our UTF-8 sources (full of CJK test fixtures) with the wrong codec.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -Duser.country=CN -Duser.language=zh
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache: enabled now that the Android modules exist, as the note here promised.
# It is a build-speed feature with a sharp edge — a task that reads a Project at execution time
# breaks it — so it stays enabled only as long as every module builds under it.
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

kotlin.code.style=official
kotlin.incremental=true
